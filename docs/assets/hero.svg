<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 554" width="1200" height="554" role="img" aria-labelledby="hero-title hero-desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="hero-title">Four deterministic renders from the shipped RELICS starter templates</title>
  <desc id="hero-desc">A contact sheet of four deterministic renders from the shipped starter templates, left to right: minimal, seed 1 (Palette: Ash, Rings: Three, Core: Dim); solidity-svg-params, seed 2 (Palette: Verdigris, Silhouette: Monolith); onchain-js, seed 3 (Band: II, Field: Quiet); market-responsive, seed 4 (Palette: Verdigris, Lattice: Tight, Temperament: Restless, Core: Point). Every image came out of the creator kit's own preview command — this file is generated by running the kit's generator sandbox on the templates in this repository, so each tile is byte-identical to the preview the kit writes for the same template and seed. The trait labels in each caption are metadata: they are drawn from their own seeded stream, independently of the image above them, so a label names the token rather than describing what it looks like.</desc>
