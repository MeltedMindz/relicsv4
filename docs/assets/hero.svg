<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 503" width="1200" height="503" role="img" aria-labelledby="hero-title hero-desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="hero-title">Four renders returned by the deployed RELICS art runtimes</title>
  <desc id="hero-desc">A contact sheet of four renders returned by the deployed RELICS art runtimes, left to right: compass on GEOMETRIC_RECURSION_V1, seed 175, market state stress; compass on GEOMETRIC_RECURSION_V1, seed 175, market state recovery; alluvium on VECTOR_COMPOSITION_V1, seed 360, market state recovery; alluvium on VECTOR_COMPOSITION_V1, seed 397, market state neutral. The first two are the same seed of the same template under two different market states, so one identity is shown twice: cut back under stress, overgrown under recovery. None of these images was drawn by this repository. Each is the SVG a deployed contract returned to an eth_call of renderV1, decoded from the data URI it came back in, and the same call returned byte-identical documents on chains 1 · 8453 · 4663. No caption here carries a trait label. Where a template does ship trait dimensions, their labels are drawn from their own seeded stream, independently of the image, so a label names the token rather than describing what it looks like.</desc>
