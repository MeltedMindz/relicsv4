<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="lp-title lp-desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="lp-title">RELICS Launchpad launch-protection fee schedule</title>
  <desc id="lp-desc">Buy-side LP fee against minutes since the pool opened. With PROTECTED_98_MINUTES the buy fee starts at 99% and falls to 1% over 98 minutes; 0 min 99%, 1 min 98%, 10 min 89%, 30 min 69%, 60 min 39%, 90 min 9%, 98 min 1%. With NONE the buy fee is a flat 1% from the first block. The sell fee is a flat 1% in both modes, at every instant. The three series are distinguished by line pattern as well as colour: the decaying buy fee is a solid line, the unprotected buy fee is long-dashed, and the sell fee is short-dashed. The unprotected buy fee and the sell fee are the same number at every instant, so they share one line: the long teal dashes are the unprotected buy and the short violet dashes between them are the sell side.</desc>
  <style>
    .bg{fill:#0b0e13}
    .panel{fill:none;stroke:#2a3340;stroke-width:1}
    .grid{stroke:#1c2430;stroke-width:1}
    .axis{stroke:#5a6878;stroke-width:1.5}
    .tick{fill:#8b98a8;font-size:12px}
    .h1{fill:#e8eaed;font-size:17px;letter-spacing:.06em}
    .h2{fill:#8b98a8;font-size:12px;letter-spacing:.04em}
    .note{fill:#7f8c9c;font-size:11px}
    .onLine{fill:#a8b6c6;font-size:11.5px}
    .lead{stroke:#4a5765;stroke-width:1}
    .lbl{font-size:12.5px}
    .sub{font-size:10.5px;opacity:.72}
    .legendBox{fill:#101620;stroke:#2a3340;stroke-width:1}
    .protectedLine{fill:none;stroke:#e0a04a;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .protectedLbl{fill:#e0a04a}
    .noneLine{fill:none;stroke:#63b7c9;stroke-width:3;stroke-dasharray:14 14;stroke-linecap:butt}
    .noneLbl{fill:#63b7c9}
    .sellLine{fill:none;stroke:#b3a4dd;stroke-width:3;stroke-dasharray:6 22;stroke-dashoffset:-18;stroke-linecap:butt}
    .sellSwatch{fill:none;stroke:#b3a4dd;stroke-width:3;stroke-dasharray:5 5;stroke-linecap:butt}
    .sellLbl{fill:#b3a4dd}
    .dot{fill:#e0a04a;stroke:#0b0e13;stroke-width:1.5}
  </style>
  <rect class="bg" x="0" y="0" width="880" height="470"/>
  <rect class="panel" x="0.5" y="0.5" width="879" height="469"/>
  <text x="74" y="32" class="h1">LAUNCH PROTECTION — LP FEE BY SIDE</text>
  <text x="74" y="50" class="h2">98-minute decay · anchored at pool initialization · no exemptions</text>
  <g>
