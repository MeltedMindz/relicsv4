    <line x1="74.0" y1="62" x2="74.0" y2="378.0" class="grid"/><text x="74.0" y="402.0" class="tick" text-anchor="middle">0</text>
    <line x1="231.6" y1="62" x2="231.6" y2="378.0" class="grid"/><text x="231.6" y="402.0" class="tick" text-anchor="middle">20</text>
    <line x1="389.1" y1="62" x2="389.1" y2="378.0" class="grid"/><text x="389.1" y="402.0" class="tick" text-anchor="middle">40</text>
    <line x1="546.7" y1="62" x2="546.7" y2="378.0" class="grid"/><text x="546.7" y="402.0" class="tick" text-anchor="middle">60</text>
    <line x1="704.2" y1="62" x2="704.2" y2="378.0" class="grid"/><text x="704.2" y="402.0" class="tick" text-anchor="middle">80</text>
    <line x1="846.0" y1="62" x2="846.0" y2="378.0" class="grid"/><text x="846.0" y="402.0" class="tick" text-anchor="middle">98</text>
  </g>
