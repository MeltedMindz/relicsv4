[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
# Large gas limit so on-chain SVG generation scripts and fuzz tests do not hit the
# default block gas ceiling during local runs.
gas_limit = 3000000000
# Scripts under script/ read/write local JSON fixtures under this repo only.
fs_permissions = [{ access = "read-write", path = "./" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"

[invariant]
runs = 32
depth = 24
fail_on_revert = false

# Named RPC endpoints for fork tests. These read from environment variables so that
# NO url or API key is ever committed. Fork tests are written to skip cleanly when the
# variable is unset (see test/fork/*), so the default `forge test` path needs no secret.
[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
