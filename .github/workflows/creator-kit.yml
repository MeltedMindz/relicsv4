name: creator-kit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No secrets, no network: the kit has zero dependencies and never contacts a chain.
permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: schema + container + validator + sandbox + fixtures
        run: npm run kit:test

      - name: every starter template validates and exports
        run: npm run kit:templates

      - name: the public export manifest lists every tracked file
        # It had a --check mode and nothing ran it, so it drifted 173 files behind — including the
        # whole creator kit, which falsified the allowlist's "every tracked file" claim. A gate
        # nobody runs is a gate that is already stale.
        run: npm run export:manifest:check

      - name: the ACV1 conformance corpus is byte-reproducible
        # This corpus is the shared expectation the Solidity decoder is ALSO checked against
        # (launchpad/test/art/ArtConfigV1Parity.t.sol). A diff here means the JavaScript codec
        # moved, and the on-chain side would find out at launch time instead of now.
        run: |
          npm run kit:acv1
          git diff --exit-code -- packages/project-schema/fixtures/acv1

      - name: fixtures are byte-reproducible
        # Regenerating must be a no-op. A diff here means a fixture drifted from the code that
        # produced it, which is exactly the drift the web importer would trip over.
        run: |
          npm run kit:fixtures
          git diff --exit-code -- packages/project-schema/fixtures
